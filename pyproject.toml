[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aisecscan"
dynamic = ["version"]
description = "Static security scanner for AI/LLM/agentic repos: any AI coding assistant config (Claude, Cursor, Copilot, Windsurf, Cline, ...), MCP servers, agents, skills, LLM app code, and AI supply chain (Checkov for AI agent stacks)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Sanjeev Jaiswal (Jassi)", email = "jassics@gmail.com" }]
keywords = ["agentic-ai", "agent-security", "security", "sast", "static-analysis", "mcp", "llm-security", "devsecops", "claude-code", "cursor", "ai-supply-chain", "owasp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/jassics/aisecscan"
Documentation = "https://jassics.github.io/aisecscan"
Issues = "https://github.com/jassics/aisecscan/issues"

[project.scripts]
aisecscan = "aisecscan.cli:app"

[tool.hatch.version]
path = "src/aisecscan/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/aisecscan"]

[tool.pytest.ini_options]
testpaths = ["tests"]
