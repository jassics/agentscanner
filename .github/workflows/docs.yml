name: Deploy docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Allow one concurrent deployment; let an in-progress gh-deploy finish rather
# than risk cancelling it mid-push.
concurrency:
  group: docs-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install docs dependencies
        run: pip install mkdocs-material mkdocstrings[python]

      - name: Install package (for mkdocstrings)
        run: pip install -e .

      - name: Deploy to GitHub Pages
        run: mkdocs gh-deploy --force
